name: build-ipa

# Bu repo private. Derleme burada kosar, cikti (IPA + SideStore kaynagi)
# ayri bir PUBLIC repoya yazilir: SideStore release asset'ini ve source.json'u
# kimlik dogrulamasi olmadan indirmek zorunda.

# macOS runner dakikalari 10x carpanla faturalaniyor: 1 gercek dakika = 10
# kota dakikasi. Her push'ta derlemek kotanin yarisini bu repoya yediriyordu
# (24 saatte 30 kosu ~ 950 faturalanan dakika). Otomatik derleme artik yalnizca
# VERSION dosyasi degisince kosuyor; ara build icin Actions sekmesinden
# "Run workflow" ile elle tetikle.
on:
  push:
    branches: [main]
    paths:
      - "VERSION"
  workflow_dispatch:

permissions:
  contents: read

# Arka arkaya push'ta bitmemis kosuyu iptal et: gecersiz kalacak bir macOS
# build'i sonuna kadar kosturmak bosa 10x dakika demek.
concurrency:
  group: build-ipa
  cancel-in-progress: true

env:
  DIST_REPO: keremcankabadayi/er-dist

jobs:
  build:
    runs-on: macos-15
    steps:
      # Surum notu icin gecmis gerekiyor: bir onceki VERSION bump'indan
      # buyana gelen commit'ler taraniyor, sig checkout'ta o gecmis yok.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: DIST_TOKEN var mi
        run: |
          if [ -z "${{ secrets.DIST_TOKEN }}" ]; then
            echo "hata: DIST_TOKEN secret'i tanimli degil." >&2
            echo "      Settings > Secrets and variables > Actions altina ekle." >&2
            exit 1
          fi

      - name: Ortam bilgisi
        run: |
          xcodebuild -version
          node --version

      - name: XcodeGen kur
        run: brew install xcodegen

      - name: Surum bilgisini hesapla
        id: meta
        run: |
          BASE="$(tr -d '[:space:]' < VERSION)"
          BUILD="${{ github.run_number }}"
          # SideStore guncellemeyi kaynaktaki `version` alanina bakarak
          # buluyor; `buildVersion` tek basina tetiklemiyor, o yuzden her
          # build ayni "1.0.0" gorunup update cikmiyordu. Yama numarasini
          # build numarasina esitliyoruz: 1.0.0 + build 15 -> 1.0.15.
          VERSION="${BASE%.*}.${BUILD}"

          # Surum notu. Tetikleyen commit her zaman "chore: surum 1.0.x"
          # oldugu icin onu yazmak bir sey anlatmiyordu; onceki VERSION
          # bump'indan buyana gelen feat/fix commit'lerini ozetliyoruz.
          # En son VERSION bump'i push tetiklediyse HEAD'in kendisi, elle
          # tetiklendiyse daha eski bir commit: HEAD ise bir oncekini al.
          HEAD_SHA="$(git rev-parse HEAD)"
          PREV="$(git log --format=%H -- VERSION | grep -v "^${HEAD_SHA}$" | head -n 1)"
          if [ -z "$PREV" ]; then
            RANGE="HEAD"
          else
            RANGE="${PREV}..HEAD"
          fi
          SUMMARY="$(
            git log --no-merges --format=%s "$RANGE" \
              | grep -E '^(feat|fix)(\([^)]*\))?: ' \
              | sed -E 's/^(feat|fix)(\([^)]*\))?: //' \
              | awk '!seen[$0]++' \
              | head -n 5 \
              | awk 'NR>1 { printf "; " } { printf "%s", $0 } END { if (NR) print "" }'
          )"

          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "tag=v${VERSION}"
            echo "date=$(date -u +%Y-%m-%d)"
            echo "summary=$SUMMARY"
          } >> "$GITHUB_OUTPUT"

      - name: Imzasiz IPA derle
        env:
          MARKETING_VERSION: ${{ steps.meta.outputs.version }}
          BUILD_NUMBER: ${{ steps.meta.outputs.build }}
        run: ./build-ipa.sh

      - name: IPA'yi artifact olarak sakla
        uses: actions/upload-artifact@v4
        with:
          name: SukelaLite-${{ steps.meta.outputs.tag }}
          path: dist/SukelaLite.ipa

      # source.json'un surum gecmisi dist reposunda yasiyor; bu repo onu
      # tutmuyor. Once klonlayip mevcut gecmisi aliyoruz.
      #
      # Bos repoya release atilamiyor ("Repository is empty", HTTP 422), o yuzden
      # dist bosken burada bir ilk commit atip push ediyoruz. Release adimi bunu
      # bekliyor.
      - name: Dist reposunu hazirla
        env:
          DIST_TOKEN: ${{ secrets.DIST_TOKEN }}
        run: |
          rm -rf distrepo
          git clone --depth 1 \
            "https://x-access-token:${DIST_TOKEN}@github.com/${DIST_REPO}.git" distrepo

          cd distrepo
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Dist reposunda yalnizca docs/source.json, docs/icon.png ve
          # Releaselerdeki IPA durur. Ilk commit bos: sadece release
          # atilabilsin diye bir HEAD gerekiyor, dosya gerekmiyor.
          if ! git rev-parse --verify HEAD >/dev/null 2>&1; then
            git symbolic-ref HEAD refs/heads/main
            git commit --allow-empty -m "chore: dagitim deposunu baslat"
            git push origin HEAD:main
            echo "dist reposu ilklendirildi"
          fi
          cd ..

          if [ -f distrepo/docs/source.json ]; then
            cp distrepo/docs/source.json docs/source.json
            echo "mevcut kaynak alindi"
          else
            rm -f docs/source.json
            echo "kaynak sifirdan uretilecek"
          fi

      - name: Release'i dist reposuna at
        env:
          GH_TOKEN: ${{ secrets.DIST_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          TITLE: "Sukela Lite ${{ steps.meta.outputs.version }} (${{ steps.meta.outputs.build }})"
          SHA: ${{ github.sha }}
          SUMMARY: ${{ steps.meta.outputs.summary }}
        run: |
          BODY="Imzasiz build, SideStore ile kurulur. Kaynak commit: $SHA"
          if [ -n "$SUMMARY" ]; then
            BODY="Bu surumde: $SUMMARY"$'\n\n'"$BODY"
          fi
          if gh release view "$TAG" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/SukelaLite.ipa --repo "$DIST_REPO" --clobber
          else
            gh release create "$TAG" dist/SukelaLite.ipa \
              --repo "$DIST_REPO" \
              --title "$TITLE" \
              --notes "$BODY"
          fi

      - name: SideStore kaynagini uret
        env:
          SUMMARY: ${{ steps.meta.outputs.summary }}
        run: |
          # SideStore'da gorunen not: build numarasi + yapilan islerin ozeti.
          NOTES="Build ${{ steps.meta.outputs.build }}"
          if [ -n "$SUMMARY" ]; then
            NOTES="$NOTES - $SUMMARY"
          fi
          # --repo dist reposu: manifestteki tum URL'ler oraya isaret etmeli.
          node tools/update-source.mjs \
            --repo "$DIST_REPO" \
            --version "${{ steps.meta.outputs.version }}" \
            --build "${{ steps.meta.outputs.build }}" \
            --tag "${{ steps.meta.outputs.tag }}" \
            --ipa "dist/SukelaLite.ipa" \
            --date "${{ steps.meta.outputs.date }}" \
            --notes "$NOTES"

      - name: Kaynagi dist reposuna yaz
        working-directory: distrepo
        run: |
          # Dali "Dist reposunu hazirla" adimi kurdu.
          # Dist reposunda yalnizca docs/ durur; onceki surumlerin biraktigi
          # README varsa temizleniyor. Ilk koşudan sonra bu satir no-op.
          git rm -q --ignore-unmatch README.md
          mkdir -p docs
          cp ../docs/source.json ../docs/icon.png docs/
          git add docs
          if git diff --cached --quiet; then
            echo "degisiklik yok"
            exit 0
          fi
          git commit -m "chore(source): ${{ steps.meta.outputs.tag }}"
          git push origin HEAD:main
