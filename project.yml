name: SukelaLite

options:
  bundleIdPrefix: com.kerem
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.9"

# Parse mantığı ayrı bir yerel pakette: WebKit içermiyor, Linux'ta
# `swift test --package-path SukelaCore` ile Mac olmadan koşuyor.
packages:
  SukelaCore:
    path: SukelaCore

targets:
  SukelaLite:
    type: application
    platform: iOS
    dependencies:
      - package: SukelaCore
      # Widget uygulamanın içine gömülüyor; ayrı bir uygulama slotu yemiyor.
      - target: SukelaWidgetExtension
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Şükela Lite
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # Widget'tan başlık açmak için: sukela://topic?link=...&title=...
        CFBundleURLTypes:
          - CFBundleURLName: com.kerem.sukelalite
            CFBundleURLSchemes: [sukela]
        # SideStore/AltStore imzalarken App Group'u bu anahtardan okuyor;
        # ücretsiz hesapta entitlement'ı kendisi üretiyor.
        ALTAppGroups: [group.com.kerem.sukelalite]
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kerem.sukelalite
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # İmzayı SideStore telefonda atıyor; burada sertifika aranmasın.
        # Cihaz build'inde build-ipa.sh ayrıca CODE_SIGNING_ALLOWED=NO geçiyor.
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

  # Gündem widget'ı. Gündemi kendi çekiyor; Cloudflare anahtarını uygulama
  # App Group üzerinden bırakıyor (extension'da WKWebView yok).
  SukelaWidgetExtension:
    type: app-extension
    platform: iOS
    dependencies:
      - package: SukelaCore
    sources:
      - path: Widget
      # Renkler uygulama hedefinde duruyor; widget de aynı paleti kullanıyor.
      - path: Sources/Theme.swift
      # App Group adını imzanın verdiği entitlement belirliyor; iki hedef de
      # aynı çözücüyü kullanmalı, yoksa farklı klasörlere bakarlar.
      - path: Sources/Data/AppGroupContainer.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: Resources/WidgetInfo.plist
      properties:
        CFBundleDisplayName: gündem
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ALTAppGroups: [group.com.kerem.sukelalite]
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kerem.sukelalite.widget
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        DEVELOPMENT_TEAM: ""

# Şemayı açıkça tanımlıyoruz: xcodebuild -scheme'in Xcode hiç açılmadan da
# çalışması için paylaşılmış bir şema dosyası gerekiyor.
schemes:
  SukelaLite:
    build:
      targets:
        SukelaLite: all
    run:
      config: Debug
    archive:
      config: Release
